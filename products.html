<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>Products | Dongguan Xiyi Apparel Co., Ltd.</title>
    <meta name="description" content="Men's apparel product categories for OEM/ODM orders: hoodies, T-shirts, sweatpants, teamwear, baseball jackets and outerwear.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="products">
    <div id="site-header"></div>

    <main>
      <div class="breadcrumb">
        <div class="page-shell">
          <a href="index.html">Home</a>
          <span> / </span>
          <span><span class="lang-en">Products</span><span class="lang-zh">产品</span></span>
        </div>
      </div>

      <section class="product-catalog-section">
        <div class="section-shell">
          <div class="quick-search reveal" data-product-filter>
            <div class="quick-search-title"><span class="lang-en">Quick Search</span><span class="lang-zh">快速筛选</span></div>
            <div class="quick-search-table" data-dynamic-product-filter></div>
          </div>

          <div class="catalog-title-row reveal">
            <div>
              <h1><span class="lang-en">Custom Men's Apparel</span><span class="lang-zh">男装定制产品</span></h1>
            </div>
          </div>

          <div class="catalog-list-heading reveal">
            <strong><span class="lang-en">Made-to-order OEM/ODM men's apparel project reference</span><span class="lang-zh">男装 OEM/ODM 定制接单项目参考</span></strong>
          </div>

          <div class="catalog-result-bar reveal">
            <span data-product-result-count>7 results</span>
            <div class="catalog-view-controls" aria-label="Display mode">
              <span>View</span>
              <button type="button" aria-label="List view" data-catalog-view="list">☰</button>
              <button type="button" aria-label="Grid view" class="is-active" data-catalog-view="grid">▦</button>
            </div>
          </div>

          <div class="product-grid catalog-products" data-product-cards data-card-mode="styles"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script src="site.js" defer></script>
  </body>
</html>
